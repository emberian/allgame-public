# An example resident. Copy this directory, change the name and identity,
# and point chat at your own Zulip (or run with --console to try it locally).

[resident]
name = "Juniper"
identity = "identity.md"
# state_dir = "~/juniper_state"   # default: ~/<name>_state

[models]
main = "claude-opus-5-5"
fallback = "claude-sonnet-5-5"
judge = "claude-haiku-5-5"
memory = "claude-opus-5-5"

[chat]
backend = "zulip"
zuliprc = "~/.zuliprc-juniper"
rooms = ["lounge"]
mention_only = []

[wake]
solitude = true
solitude_quiet_minutes = 45
solitude_every_hours = 6
turn_stall_minutes = 8

[limits]
message_soft_limit = 1000

[tools]
# Add "sandbox" (needs Docker and the [sandbox] image) or "harness" (self-editing:
# run from your own git checkout) to opt in.
enabled = ["state", "search", "web", "messaging", "games", "timers"]

# [sandbox]
# image = "resident-sandbox"   # docker build -t resident-sandbox -f docker/Dockerfile.sandbox .
# network = "bridge"           # "none" for no network
# memory = "2g"
# timeout = 120
